<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>理事会運営ポータル</title>

<!-- ▼▼▼ ここだけ確認：自分のWebアプリURL（末尾 /exec）に必ず書き換える ▼▼▼ -->
<script>
  var APP_URL = "https://script.google.com/macros/s/AKfycbzCdamCvBWXd177j0ilktnmn_eCHKQ4l_XsHWWm4Tn_gHzgn5qjU_kVM2A50EakpKzIbw/exec";
</script>
<!-- ▲▲▲ ここだけ確認 ▲▲▲ -->

<!-- ホーム画面アイコン（建物） -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="theme-color" content="#2b211a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="理事会ポータル">
<meta name="mobile-web-app-capable" content="yes">

<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;gap:16px;text-align:center;
    background:radial-gradient(120% 120% at 50% 18%,#3d2e20,#1c140e 70%);
    color:#f3e9d6;font-family:'Hiragino Kaku Gothic ProN',Meiryo,system-ui,sans-serif;
    padding:26px 24px}
  img.logo{width:122px;height:122px;border-radius:26px;box-shadow:0 14px 40px rgba(0,0,0,.55);
    border:1px solid rgba(176,141,79,.5)}
  .eyebrow{font-size:11px;letter-spacing:.24em;color:#b08d4f}
  h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.08em;
    font-family:'Yu Mincho','Shippori Mincho',serif}
  .org{font-size:12px;color:#b08d4f;letter-spacing:.04em}
  .open{margin-top:8px;background:linear-gradient(135deg,#b08d4f,#8c6c34);color:#fff;border:0;
    border-radius:12px;padding:17px 44px;font-size:17px;font-weight:700;letter-spacing:.06em;
    cursor:pointer;box-shadow:0 8px 24px rgba(140,108,52,.4);text-decoration:none;
    display:inline-flex;align-items:center;gap:9px}
  .tip{font-size:12.5px;color:#cdbb98;line-height:1.6;max-width:360px;margin-top:6px;text-align:left;
    background:rgba(176,141,79,.1);border:1px solid rgba(176,141,79,.28);border-radius:14px;padding:16px 18px}
  .tip b{color:#f3e9d6;font-weight:600}
  .tip-h{display:flex;align-items:center;gap:9px;color:#f3e9d6;font-weight:700;font-size:13.5px;
    letter-spacing:.02em;margin-bottom:9px}
  .tip-h svg{width:19px;height:19px;color:#d9b878;flex:0 0 auto}
  .tip p{margin:0 0 10px;white-space:nowrap}
  .tip p:last-child{margin-bottom:0}
  .tip .step{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
    border-radius:50%;background:#b08d4f;color:#1c140e;font-size:11px;font-weight:800;margin-right:7px}
  .tip .kbd{display:inline-block;min-width:20px;text-align:center;padding:1px 6px;margin:0 2px;
    border:1px solid rgba(243,233,214,.38);border-radius:6px;background:rgba(243,233,214,.08);
    color:#f3e9d6;font-weight:700;line-height:1.4}
  .spin{width:18px;height:18px;border:2px solid rgba(243,233,214,.4);border-top-color:#f3e9d6;
    border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hidden{display:none}

  /* アプリを全画面iframeで埋め込む（Googleの警告バーを出さないため） */
  #appFrame{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#fff;display:none;z-index:10}
  #loading{position:fixed;inset:0;display:none;align-items:center;justify-content:center;gap:10px;
    background:radial-gradient(120% 120% at 50% 18%,#3d2e20,#1c140e 70%);color:#f3e9d6;font-size:15px;z-index:20}
  body.embed{padding:0;display:block}
  body.embed #landing{display:none}
  body.embed #appFrame{display:block}
</style>
</head>
<body>
  <div id="landing">
    <img class="logo" src="icons/icon-512.png" alt="理事会運営ポータル">
    <div class="eyebrow">ASSOCIA TERRACE CHIKUSHINO</div>
    <h1>理事会運営ポータル</h1>
    <div class="org">アソシアテラス筑紫野管理組合　第13期</div>

    <a class="open" id="openBtn" href="#">理事会ポータルを開く ➜</a>
    <div class="tip" id="tip">
      <div class="tip-h">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M12 8.5v6M9 11.5h6"/></svg>
        ホーム画面に追加すると便利です
      </div>
      <p>アイコンから<b>ワンタップ</b>で開けます。</p>
      <p><span class="step">1</span>メニュー <span class="kbd">⋮</span> を開く</p>
      <p><span class="step">2</span>「<b>ホーム画面に追加</b>」を選ぶ</p>
    </div>
  </div>

  <div id="loading"><span class="spin"></span> ひらいています…</div>
  <iframe id="appFrame" title="理事会運営ポータル" allow="clipboard-read; clipboard-write; camera"></iframe>

<script>
  (function(){
    var standalone = window.matchMedia('(display-mode: standalone)').matches
                  || window.navigator.standalone === true
                  || document.referrer.indexOf('android-app://') === 0;

    var frame   = document.getElementById('appFrame');
    var loading = document.getElementById('loading');

    function openApp(){
      loading.style.display = 'flex';
      frame.src = APP_URL;
      document.body.classList.add('embed');
      frame.addEventListener('load', function(){ loading.style.display = 'none'; });
      // 保険：一定時間で必ずローディングを消す
      setTimeout(function(){ loading.style.display = 'none'; }, 6000);
    }

    document.getElementById('openBtn').addEventListener('click', function(e){ e.preventDefault(); openApp(); });

    // インストール済み（ホーム画面アイコン起動）→ そのままアプリを埋め込み表示
    if (standalone) { openApp(); }
    // ブラウザ表示 → 入口ページ（ホーム追加の案内つき）。「開く」で埋め込み表示。

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  })();
</script>
</body>
</html>
