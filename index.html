<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>理事会運営ポータル</title>

<!-- ▼▼▼ ここだけ確認：自分のWebアプリURL（末尾 /exec）に必ず書き換える ▼▼▼ -->
<script>
  // 2026-07-14 associa移設：実行者を associaterrace に切り替えた新デプロイへ差し替え。
  // 掲示QR・ホーム画面アイコンが指すのは「このランチャー」なので、GAS側のURLが変わってもここ1行で吸収できる。
  var APP_URL = "https://script.google.com/macros/s/AKfycbzv7opV6_FCePKCH9CywlWt9kkeYnmVpooMpiqy06CgM-tvgCFEO0Em4NgAOUZJw1WtNQ/exec";
</script>
<!-- ▲▲▲ ここだけ確認 ▲▲▲ -->

<!-- ホーム画面アイコン（建物） -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="theme-color" content="#2b211a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="理事会ポータル">
<meta name="mobile-web-app-capable" content="yes">

<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;gap:16px;text-align:center;
    background:radial-gradient(135% 115% at 50% 8%,#463320,#19110a 74%);
    color:#f3e9d6;font-family:'Hiragino Kaku Gothic ProN',Meiryo,system-ui,sans-serif;
    padding:52px 26px}
  #landing{display:flex;flex-direction:column;align-items:center;width:100%;max-width:380px;
    animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
  img.logo{width:112px;height:112px;border-radius:28px;
    box-shadow:0 20px 54px rgba(0,0,0,.5),0 0 0 1px rgba(176,141,79,.32),0 0 52px rgba(176,141,79,.20);
    animation:float 6.5s ease-in-out infinite}
  .eyebrow{font-size:10.5px;letter-spacing:.36em;color:#c8a05a;font-weight:600;
    margin-top:34px;padding-left:.36em}
  h1{margin:15px 0 0;font-size:26px;font-weight:600;letter-spacing:.13em;color:#f7efdd;
    font-family:'Yu Mincho','Shippori Mincho',serif}
  .org{font-size:12.5px;color:#bd9a5b;letter-spacing:.07em;margin-top:13px}
  .open{margin-top:44px;background:linear-gradient(135deg,#d3aa5e,#9a7736);color:#1b1309;border:0;
    border-radius:15px;padding:19px 52px;font-size:17px;font-weight:800;letter-spacing:.09em;
    cursor:pointer;box-shadow:0 14px 34px rgba(140,108,52,.42);text-decoration:none;
    width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .28s ease,box-shadow .28s ease}
  .open:hover{transform:translateY(-2px);box-shadow:0 18px 42px rgba(140,108,52,.55)}
  .open:active{transform:translateY(0)}
  .tip{font-size:12.5px;color:#d4c4a3;line-height:1.75;width:100%;margin-top:34px;text-align:left;
    background:rgba(176,141,79,.075);border:1px solid rgba(176,141,79,.18);border-radius:16px;padding:19px 21px}
  .tip b{color:#f3e9d6;font-weight:700}
  .tip-h{display:flex;align-items:center;gap:9px;color:#f3e9d6;font-weight:700;font-size:13.5px;
    letter-spacing:.02em;margin-bottom:12px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @media(prefers-reduced-motion:reduce){#landing,img.logo{animation:none}}
  .tip-h svg{width:19px;height:19px;color:#d9b878;flex:0 0 auto}
  .tip p{margin:0 0 10px;white-space:nowrap}
  .tip p:last-child{margin-bottom:0}
  .tip .step{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
    border-radius:50%;background:#b08d4f;color:#1c140e;font-size:11px;font-weight:800;margin-right:7px}
  .tip .kbd{display:inline-block;min-width:20px;text-align:center;padding:1px 6px;margin:0 2px;
    border:1px solid rgba(243,233,214,.38);border-radius:6px;background:rgba(243,233,214,.08);
    color:#f3e9d6;font-weight:700;line-height:1.4}
  .spin{width:18px;height:18px;border:2px solid rgba(243,233,214,.4);border-top-color:#f3e9d6;
    border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hidden{display:none}

  /* 「開く」タップ後の一瞬だけ出す遷移中ローディング */
  #loading{position:fixed;inset:0;display:none;align-items:center;justify-content:center;gap:10px;
    background:radial-gradient(120% 120% at 50% 18%,#3d2e20,#1c140e 70%);color:#f3e9d6;font-size:15px;z-index:20}
</style>
</head>
<body>
  <div id="landing">
    <img class="logo" src="icons/icon-512.png" alt="理事会運営ポータル">
    <div class="eyebrow">ASSOCIA TERRACE CHIKUSHINO</div>
    <h1>理事会運営ポータル</h1>
    <div class="org">アソシアテラス筑紫野管理組合　第13期</div>

    <a class="open" id="openBtn" href="#">理事会ポータルを開く ➜</a>
    <div class="tip" id="tip">
      <div class="tip-h">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M12 8.5v6M9 11.5h6"/></svg>
        ホーム画面に追加すると便利です
      </div>
      <p>アイコンから<b>ワンタップ</b>で開けます。</p>
      <p><span class="step">1</span>メニュー <span class="kbd">⋮</span> を開く</p>
      <p><span class="step">2</span>「<b>ホーム画面に追加</b>」を選ぶ</p>
    </div>
  </div>

  <div id="loading"><span class="spin"></span> ひらいています…</div>

<script>
  (function(){
    var standalone = window.matchMedia('(display-mode: standalone)').matches
                  || window.navigator.standalone === true
                  || document.referrer.indexOf('android-app://') === 0;

    var loading = document.getElementById('loading');

    // GAS(/exec) は X-Frame-Options: SAMEORIGIN を返すため iframe 埋め込みは不可
    //（フレーム内だと net::ERR_BLOCKED_BY_RESPONSE ＝ 壊れたアイコンになる）。
    // よって最上位ウィンドウでそのままアプリURLへ遷移する。
    function openApp(){
      loading.style.display = 'flex';
      location.replace(APP_URL);
    }

    document.getElementById('openBtn').addEventListener('click', function(e){ e.preventDefault(); openApp(); });

    // インストール済み（ホーム画面アイコン起動）or 直接/execから転送されて来た(?app=1)
    // → そのままアプリを埋め込み表示（＝Googleの警告バーを出さない）
    var auto = standalone || /[?&]app=1/.test(location.search);
    if (auto) { openApp(); }
    // ブラウザ表示 → 入口ページ（ホーム追加の案内つき）。「開く」で埋め込み表示。

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  })();
</script>
</body>
</html>
